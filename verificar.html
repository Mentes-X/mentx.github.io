<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Certificado | MentX</title>
    <style>
        body { font-family: 'Helvetica', sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .logo { width: 100px; margin-bottom: 20px; }
        .status { font-size: 1.5rem; font-weight: bold; margin: 20px 0; }
        .valid { color: #007554; } /* Verde MentX */
        .invalid { color: #cc0000; }
        .details { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #007554; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <img src="logo-abrol.png" alt="MentX Logo" class="logo">
    <h2>Sistema de Verificación MentX</h2>
    
    <div id="loading" class="loader"></div>
    <div id="status-msg" class="status">Verificando folio...</div>

    <div id="info-estudiante" class="details">
        <p><strong>Estudiante:</strong> <span id="res-nombre"></span></p>
        <p><strong>Curso:</strong> <span id="res-curso"></span></p>
        <p><strong>Fecha de Emisión:</strong> <span id="res-fecha"></span></p>
        <hr>
        <p><strong>Contenido Validado:</strong></p>
        <ul id="res-contenido"></ul>
    </div>
</div>

<script>
    // 1. Obtener el folio desde la URL (?codigo=MX-2026-001)
    const urlParams = new URLSearchParams(window.location.search);
    const folio = urlParams.get('codigo');

    // 2. Tu URL de Google Apps Script (La misma que usas en app.js)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzWecJHGdzARl7jNCt1k6JztmR1iDca5L3TMQcvvhP0JMX9RkuVBfmEmaoVB51NlRxp2g/exec";

    async function verificar() {
        if (!folio) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('status-msg').innerHTML = "⚠️ No se proporcionó un folio.";
            document.getElementById('status-msg').className = "status invalid";
            return;
        }

        try {
            const respuesta = await fetch(`${WEB_APP_URL}?codigo=${folio}`);
            const datos = await respuesta.json();

            document.getElementById('loading').style.display = 'none';

            if (datos.autorizado) {
                // Mostrar éxito
                document.getElementById('status-msg').innerHTML = "✅ Certificado Auténtico";
                document.getElementById('status-msg').className = "status valid";
                
                // Rellenar datos
                document.getElementById('res-nombre').innerText = datos.nombre || "N/A";
                document.getElementById('res-curso').innerText = datos.curso || "Programa MentX";
                document.getElementById('res-fecha').innerText = new Date(datos.fecha).toLocaleDateString() || "Reciente";
                
                // Mostrar lista de contenido (Si el script la envía)
                const lista = document.getElementById('res-contenido');
                const temas = datos.contenido ? datos.contenido.split(',') : ["Formación académica completa"];
                temas.forEach(tema => {
                    let li = document.createElement('li');
                    li.innerText = tema;
                    lista.appendChild(li);
                });

                document.getElementById('info-estudiante').style.display = 'block';
            } else {
                // Mostrar error
                document.getElementById('status-msg').innerHTML = "❌ Certificado No Válido";
                document.getElementById('status-msg').className = "status invalid";
            }
        } catch (e) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('status-msg').innerHTML = "Error de conexión con el servidor.";
        }
    }

    window.onload = verificar;
</script>

</body>
</html>
