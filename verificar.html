<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Certificado | MentX</title>
    <style>
        body { font-family: 'Helvetica', sans-serif; text-align: center; padding: 50px 20px; background: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .logo { width: 100px; margin-bottom: 15px; }
        .status { font-size: 1.4rem; font-weight: bold; margin: 20px 0; }
        .valid { color: #007554; }
        .invalid { color: #cc0000; }
        .details { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; display: none; line-height: 1.5; }
        .details ul { padding-left: 20px; margin-top: 8px; }
        .details li { margin-bottom: 6px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #007554; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <img src="logo-mentx.png" alt="MentX Logo" class="logo">
    <h2>Sistema de Verificación MentX</h2>
    
    <div id="loading" class="loader"></div>
    <div id="status-msg" class="status">Verificando folio...</div>

    <div id="info-estudiante" class="details">
        <p><strong>Folio:</strong> <span id="res-folio"></span></p>
        <p><strong>Participante:</strong> <span id="res-nombre"></span></p>
        <p><strong>Programa:</strong> <span id="res-curso"></span></p>
        <p><strong>Fecha de Emisión:</strong> <span id="res-fecha"></span></p>
        <hr>
        <p><strong>Contenido Programático Validado:</strong></p>
        <ul id="res-contenido"></ul>
    </div>
</div>

<!-- Se enlaza config.js como fuente única del temario y títulos -->
<script src="config.js"></script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const folio = urlParams.get('codigo') ? urlParams.get('codigo').trim().toUpperCase() : null;

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzWecJHGdzARl7jNCt1k6JztmR1iDca5L3TMQcvvhP0JMX9RkuVBfmEmaoVB51NlRxp2g/exec";

    async function verificar() {
        if (!folio) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('status-msg').innerHTML = "⚠️ No se proporcionó un folio de verificación.";
            document.getElementById('status-msg').className = "status invalid";
            return;
        }

        try {
            const respuesta = await fetch(`${WEB_APP_URL}?codigo=${encodeURIComponent(folio)}`);
            const datos = await respuesta.json();

            document.getElementById('loading').style.display = 'none';

            if (datos.autorizado) {
                document.getElementById('status-msg').innerHTML = "✅ Certificado Auténtico";
                document.getElementById('status-msg').className = "status valid";
                
                // Busca el curso correspondiente en config.js usando el cursoId devuelto por Google
                const cursoObj = (typeof COURSES !== 'undefined') 
                    ? COURSES.find(c => c.id === datos.cursoId) || COURSES[0] 
                    : null;

                document.getElementById('res-folio').innerText = folio;
                document.getElementById('res-nombre').innerText = datos.nombre || "N/A";
                document.getElementById('res-curso').innerText = cursoObj ? cursoObj.titulo : "Programa MentX";
                
                const fechaObj = new Date(datos.fecha);
                document.getElementById('res-fecha').innerText = !isNaN(fechaObj) ? fechaObj.toLocaleDateString('es-VE') : "Vigente 2026";
                
                // Renderiza el arreglo exacto de 'temario' definido en config.js
                const lista = document.getElementById('res-contenido');
                lista.innerHTML = "";
                const temas = (cursoObj && Array.isArray(cursoObj.temario)) 
                    ? cursoObj.temario 
                    : ["Formación académica completa"];
                
                temas.forEach(tema => {
                    let li = document.createElement('li');
                    li.innerText = tema;
                    lista.appendChild(li);
                });

                document.getElementById('info-estudiante').style.display = 'block';
            } else {
                document.getElementById('status-msg').innerHTML = "❌ Certificado No Válido";
                document.getElementById('status-msg').className = "status invalid";
            }
        } catch (e) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('status-msg').innerHTML = "⚠️ Error de conexión con la base de datos.";
            document.getElementById('status-msg').className = "status invalid";
        }
    }

    window.onload = verificar;
</script>

</body>
</html>
